<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>胡闹厨房</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-cream: #FFF8F0;
  --bg-warm: #FFF3E6;
  --accent: #E07A3D;
  --accent-deep: #C25A1F;
  --accent-green: #5B8C5A;
  --accent-pink: #E8816B;
  --text-primary: #4A3728;
  --text-secondary: #7A6553;
  --card-bg: #FFFAF5;
  --card-border: #F0D5C0;
  --shadow-sm: 0 2px 8px rgba(180, 120, 80, 0.08);
  --shadow-md: 0 4px 16px rgba(180, 120, 80, 0.12);
  --shadow-lg: 0 8px 32px rgba(180, 120, 80, 0.15);
  --radius: 16px;
  --radius-sm: 10px;
  --font-heading: 'STZhongsong', '华文中宋', 'SimSun', 'Noto Serif CJK SC', serif;
  --font-body: 'KaiTi', '楷体', 'STKaiti', 'Noto Sans CJK SC', sans-serif;
  --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: #FFFAF2;
  color: var(--text-primary);
  line-height: 1.7;
  min-height: 100vh;
  /* Manga-inspired halftone dots + warm gradient */
  background:
    #FFFAF2;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(255,200,150,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 30%, rgba(255,180,130,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 40% 80%, rgba(240,170,120,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 65%, rgba(255,220,180,0.06) 0%, transparent 50%);
  position: relative;
}

.header {
  background:
    linear-gradient(135deg, #FFF5E6 0%, #FFE8D0 50%, #FFDDB8 100%);
  background: linear-gradient(135deg, #FFF5E6 0%, #FFE8D0 50%, #FFDDB8 100%);
  border-bottom: 3px solid #C8A880;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  box-shadow: 0 2px 0 #F5D5B0, 0 4px 0 rgba(200,150,100,0.08);
}
.header-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 70px;
}
.logo {
  font-family: var(--font-heading);
  font-size: 28px; color: var(--accent-deep);
  letter-spacing: 2px; font-weight: bold;
  cursor: pointer; text-decoration: none;
}
.nav {
  display: flex; gap: 4px;
  background: rgba(255,255,255,0.6);
  border-radius: 28px; padding: 4px;
  border: 1px solid var(--card-border);
}
.nav-btn {
  font-family: var(--font-body); font-size: 16px;
  padding: 8px 24px; border: none;
  background: transparent; color: var(--text-secondary);
  border-radius: 24px; cursor: pointer;
  transition: var(--transition); letter-spacing: 1px;
}
.nav-btn.active {
  background: var(--accent); color: #fff;
  box-shadow: 0 2px 8px rgba(224, 122, 61, 0.3);
}
.nav-btn:hover:not(.active) {
  color: var(--accent); background: rgba(224, 122, 61, 0.08);
}

.main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }

.users-strip {
  background: linear-gradient(135deg, #FFF9F2 0%, #FFF3E3 100%);
  border: 2.5px solid #D4B896;
  border-radius: 12px; padding: 20px 32px;
  margin-bottom: 36px;
  box-shadow: 4px 4px 0 rgba(160,110,70,0.12), 0 4px 12px rgba(180,130,100,0.06);
  display: flex; align-items: center; justify-content: center;
  gap: 36px; flex-wrap: wrap;
}
.user-chip {
  display: flex; align-items: center; gap: 12px;
  transition: var(--transition);
}
.user-chip:hover { transform: translateY(-2px); }
.user-chip .avatar {
  width: 56px; height: 56px;
  border-radius: 50%; object-fit: cover;
  border: 3px solid var(--card-border);
  box-shadow: var(--shadow-sm); transition: var(--transition);
}
.user-chip:hover .avatar {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(224, 122, 61, 0.25);
}
.user-chip .name {
  font-family: var(--font-heading); font-size: 18px;
  color: var(--text-primary); letter-spacing: 1px;
}

.page-section { display: none; }
.page-section.active { display: block; animation: fadeIn 0.4s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 28px;
  flex-wrap: wrap; gap: 16px;
}
.section-title {
  font-family: var(--font-heading); font-size: 26px;
  color: var(--accent-deep); letter-spacing: 2px;
  position: relative; padding-bottom: 8px;
}
.section-title::after {
  content: ''; position: absolute; left: 0; bottom: 0;
  width: 48px; height: 3px;
  background: var(--accent); border-radius: 2px;
}

.btn {
  font-family: var(--font-body); font-size: 15px;
  padding: 10px 24px; border: 2px solid transparent; border-radius: 24px;
  cursor: pointer; transition: var(--transition);
  letter-spacing: 1px; display: inline-flex;
  align-items: center; gap: 6px;
}
.btn-primary {
  background: var(--accent); color: #fff;
  box-shadow: 3px 3px 0 rgba(180,100,50,0.2), 0 2px 8px rgba(224,122,61,0.3);
  border: 1px solid rgba(255,255,255,0.2);
}
.btn-primary:hover {
  background: var(--accent-deep); transform: translateY(-2px);
  box-shadow: 4px 4px 0 rgba(180,100,50,0.25), 0 4px 14px rgba(194,90,31,0.35);
}
.btn-success {
  background: var(--accent-green); color: #fff;
  box-shadow: 0 2px 8px rgba(91, 140, 90, 0.3);
}
.btn-success:hover { background: #4A7A49; transform: translateY(-1px); }
.btn-ghost {
  background: transparent; color: var(--accent);
  border: 1.5px solid var(--card-border);
}
.btn-ghost:hover {
  background: rgba(224, 122, 61, 0.06);
  border-color: var(--accent);
}
.btn-sm { padding: 6px 16px; font-size: 13px; }
.btn-lg { padding: 14px 36px; font-size: 17px; }
.btn-danger { background: #D4695A; color: #fff; }
.btn-danger:hover { background: #B84D3F; }

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 20px;
}
.recipe-card {
  background: var(--card-bg);
  border: 2.5px solid #D4B896;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 4px 4px 0 rgba(160,110,70,0.15), 0 3px 12px rgba(180,130,100,0.08);
  transition: var(--transition);
  position: relative;
}
.recipe-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 12px;
  pointer-events: none;
}
.recipe-card:hover {
  box-shadow: 5px 5px 0 rgba(180,130,100,0.18), 0 8px 24px rgba(180,130,100,0.14);
  transform: translateY(-3px) rotate(-0.5deg);
}
.recipe-card-img {
  width: 100%; height: 200px; object-fit: cover;
  background: linear-gradient(135deg, #FDEBD0 0%, #FAD7A1 100%);
}
.recipe-card-body { padding: 18px 20px; }
.recipe-card-title {
  font-family: var(--font-heading); font-size: 20px;
  color: var(--text-primary); letter-spacing: 1px; margin-bottom: 4px;
}
.recipe-source {
  font-size: 13px; color: var(--accent);
  display: flex; align-items: center; gap: 4px; margin-bottom: 10px;
}
.recipe-source a {
  color: var(--accent); text-decoration: none;
  max-width: 200px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; display: inline-block;
}
.recipe-desc {
  font-size: 14px; color: var(--text-secondary);
  line-height: 1.6; margin-bottom: 12px;
  white-space: pre-line;
  display: -webkit-box;
  -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  overflow: hidden;
}
.recipe-meta { display: flex; gap: 16px; font-size: 13px; color: #B8957A; }
.recipe-card-footer {
  padding: 12px 20px; border-top: 1px solid var(--card-border);
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.recipe-card-footer .actions { display: flex; gap: 6px; }
.recipe-status-tag {
  font-size: 12px; padding: 3px 10px; border-radius: 10px;
  letter-spacing: 1px;
}
.tag-cooking { background: #FFF0DC; color: #E07A3D; border: 1px solid #F0C78E; }
.tag-done { background: #E8F5E2; color: #5B8C5A; border: 1px solid #A8D5A2; }
.tag-new { background: #FFF0DC; color: #C25A1F; border: 1px solid #F0C78E; }

.cooking-steps {
  list-style: none; counter-reset: step;
}
.cooking-steps li {
  counter-increment: step;
  display: flex; gap: 14px; align-items: flex-start;
  padding: 14px 0; border-bottom: 1px solid var(--card-border);
}
.cooking-steps li::before {
  content: counter(step);
  min-width: 32px; height: 32px;
  background: var(--accent); color: #fff;
  border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  font-family: var(--font-heading);
  font-size: 14px; font-weight: bold; flex-shrink: 0;
}
.cooking-steps li .step-text {
  font-size: 15px; line-height: 1.7; flex: 1;
}
.cooking-steps li:last-child { border-bottom: none; }

.dish-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
}
.dish-card {
  background: var(--card-bg);
  border: 2.5px solid #D4B896;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 4px 4px 0 rgba(160,110,70,0.15), 0 3px 12px rgba(180,130,100,0.08);
  transition: var(--transition);
  position: relative;
}
.dish-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 12px;
  pointer-events: none;
}
.dish-card:hover {
  box-shadow: 5px 5px 0 rgba(180,130,100,0.18), 0 8px 24px rgba(180,130,100,0.14);
  transform: translateY(-3px) rotate(0.5deg);
}
.dish-photo {
  width: 100%; height: 240px; object-fit: cover;
  background: linear-gradient(135deg, #FDEBD0, #FAD7A1);
}
.dish-body { padding: 18px 20px; }
.dish-title {
  font-family: var(--font-heading); font-size: 20px;
  color: var(--text-primary); letter-spacing: 1px;
}
.dish-author { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
.dish-desc {
  font-size: 14px; color: var(--text-secondary);
  line-height: 1.6; margin-bottom: 12px; white-space: pre-line;
}
.dish-rating { display: flex; align-items: center; gap: 4px; }
.star { font-size: 20px; color: #F0C78E; }
.star.empty { color: #E0D5C5; }
.dish-footer {
  padding: 12px 20px; border-top: 1px solid var(--card-border);
  display: flex; justify-content: flex-end; gap: 8px;
}

.empty-state {
  text-align: center; padding: 64px 24px; color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-state .empty-text {
  font-family: var(--font-heading); font-size: 18px; margin-bottom: 8px;
}
.empty-state .empty-hint { font-size: 14px; }

.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(74, 55, 40, 0.5);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 0.2s ease;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: linear-gradient(180deg, #FFFBF5 0%, #FFF6EC 100%);
  border: 2.5px solid #D4B896;
  border-radius: 14px;
  box-shadow: 6px 6px 0 rgba(180,130,100,0.12), 0 12px 40px rgba(180,130,100,0.15);
  width: 100%; max-width: 540px;
  max-height: 85vh; overflow-y: auto;
  padding: 32px;
  position: relative;
}
.modal::after {
  content: '';
  position: absolute; inset: 0;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 12px;
  pointer-events: none;
}
.modal h3 {
  font-family: var(--font-heading); font-size: 22px;
  color: var(--accent-deep); margin-bottom: 24px; letter-spacing: 1px;
}
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-family: var(--font-heading);
  font-size: 15px; color: var(--text-primary);
  margin-bottom: 6px; letter-spacing: 0.5px;
}
.form-group input,
.form-group textarea,
.form-group select {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid var(--card-border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body); font-size: 14px;
  color: var(--text-primary); background: #fff;
  transition: var(--transition);
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(224, 122, 61, 0.1);
}
.form-group textarea { min-height: 100px; resize: vertical; }
.modal-actions {
  display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px;
}

.rating-input { display: flex; gap: 6px; flex-wrap: wrap; }
.rating-star {
  font-size: 14px; cursor: pointer; color: #C0B0A0;
  transition: var(--transition); padding: 5px 12px;
  border-radius: 14px; white-space: nowrap;
  border: 1.5px solid var(--card-border);
  background: #fff;
}
.rating-star.active { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: bold; }
.rating-star:hover { color: var(--accent); border-color: var(--accent); background: rgba(224,122,61,0.06); }

.link-fetch-area {
  display: flex; gap: 8px; align-items: flex-end;
}
.link-fetch-area input { flex: 1; }
.fetch-status {
  font-size: 13px; margin-top: 6px; min-height: 20px;
}
.fetch-status.loading { color: var(--accent); }
.fetch-status.success { color: var(--accent-green); }
.fetch-status.error { color: #D4695A; }
.fetched-preview {
  margin-top: 12px; padding: 12px;
  background: #FFF3E6; border-radius: var(--radius-sm);
  border: 1px solid var(--card-border);
}
.fetched-preview img {
  max-width: 100%; max-height: 160px;
  border-radius: var(--radius-sm); margin-bottom: 8px;
}

@media (max-width: 768px) {
  .header-inner { height: 52px; }
  .logo { font-size: 18px; }
  .nav-btn { padding: 5px 10px; font-size: 13px; }
  .main { padding: 14px 10px 48px; }
  .users-strip { gap: 8px; padding: 10px 8px; }
  .user-chip { gap: 6px; }
  .user-chip .avatar { width: 36px; height: 36px; }
  .user-chip .name { font-size: 13px; }
  .recipe-grid, .dish-grid { grid-template-columns: 1fr; gap: 14px; }
  .recipe-card-img-wrap, .recipe-card-img { height: 170px; }
  .dish-photo { height: 190px; }
  .section-title { font-size: 19px; }
  .section-header { gap: 8px; }
  .modal { padding: 16px; border-radius: 12px; margin: 8px; max-width: 95vw !important; }
  .modal h3 { font-size: 18px; margin-bottom: 16px; }
  .link-fetch-area { flex-direction: column; }
  .btn { font-size: 13px; padding: 7px 14px; }
  .btn-lg { padding: 12px 28px; font-size: 15px; }
  .encourage-banner { font-size: 13px; padding: 10px 12px; }
  .cooking-steps li { padding: 10px 0; }
  .cooking-steps li::before { min-width: 26px; height: 26px; font-size: 12px; }
  .cooking-steps li .step-text { font-size: 14px; }
  .rating-radio-label { padding: 8px 12px; font-size: 13px; }
  .form-group input, .form-group textarea, .form-group select { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.form-hint { font-size: 13px; color: #B8957A; margin-bottom: 16px; line-height: 1.6; }
.encourage-banner {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, #FFF5E6, #FFEAD4);
  border: 2.5px solid #D4B896;
  border-radius: 12px;
  padding: 12px 20px;
  text-align: center;
  font-family: var(--font-body);
  font-size: 15px; color: var(--accent-deep);
  letter-spacing: 1px;
  box-shadow: 3px 3px 0 rgba(160,110,70,0.12);
}
.recipe-card-img-wrap { height: 200px; overflow: hidden; }
.recipe-ingredients {
  font-size: 12px; color: #B8957A;
  margin-bottom: 6px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.cooking-content h4 { font-family: var(--font-heading); color: var(--accent-deep); }
.cooking-chef { color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; }
.cooking-ingredients {
  background: #FFF8F0; border: 1px solid var(--card-border);
  border-radius: var(--radius-sm); padding: 14px 16px;
  margin-bottom: 8px;
}
.cooking-ingredients h4 { margin: 0 0 6px 0; font-family: var(--font-heading); color: var(--accent-deep); font-size: 15px; }
.cooking-ingredients p { font-size: 14px; line-height: 1.8; color: var(--text-primary); }
.cooking-encourage {
  text-align: center; margin-top: 18px;
  font-size: 14px; color: var(--accent); font-style: italic;
}
.dish-rating-single { margin: 6px 0; }

/* Radio rating */
.rating-radio-group { display: flex; flex-direction: column; gap: 8px; }
.rating-radio-label {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border: 2px solid var(--card-border);
  border-radius: var(--radius-sm); cursor: pointer;
  transition: var(--transition); font-size: 15px;
  font-family: var(--font-body);
}
.rating-radio-label:hover { border-color: var(--accent); background: rgba(224,122,61,0.04); }
.rating-radio-label.checked { border-color: var(--accent); background: rgba(224,122,61,0.08); }
.rating-radio-label input[type=radio] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }

/* Toast */
.toast-msg {
  position: fixed; bottom: 50px; left: 50%;
  transform: translateX(-50%);
  background: #5B8C5A; color: #fff;
  padding: 14px 28px 18px 28px; border-radius: 16px;
  font-family: KaiTi, STKaiti, serif;
  font-size: 15px; letter-spacing: 1px;
  z-index: 999; white-space: nowrap;
  box-shadow: 4px 4px 0 rgba(60,90,60,0.2), 0 6px 24px rgba(91,140,90,0.25);
  animation: toastIn 0.4s ease;
  border: 2px solid rgba(255,255,255,0.3);
}
.toast-msg.toast-hide { opacity: 0; transition: opacity 0.4s ease; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  grid-column: 1 / -1;

  border: 2.5px solid #D4B896;

  text-align: center;
  font-family: var(--font-body);
  font-size: 15px; color: var(--accent-deep);
  letter-spacing: 1px;
  box-shadow: 3px 3px 0 rgba(160,110,70,0.12);
}
.recipe-card-img-wrap { height: 200px; overflow: hidden; }
.recipe-card-img-wrap .recipe-card-img { width: 100%; height: 100%; object-fit: cover; }
.recipe-ingredients {
  font-size: 12px; color: #B8957A;
  margin-bottom: 6px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.recipe-source .source-link {
  color: var(--accent) !important;
  text-decoration: none !important;
  font-size: 13px;
}
.recipe-source .source-link:hover { text-decoration: underline !important; }
.cooking-content h4 { font-family: var(--font-heading); color: var(--accent-deep); }
.cooking-chef { color: var(--text-secondary); font-size: 14px; margin-bottom: 12px; }
.cooking-ingredients {
  background: #FFF8F0; border: 1px solid var(--card-border);
  border-radius: var(--radius-sm); padding: 14px 16px;
  margin-bottom: 8px;
}

  text-align: center; margin-top: 18px;
  font-size: 14px; color: var(--accent); font-style: italic;
}

/* Copy hint box */
.copy-hint-box {
  background: #fff; border: 1px dashed var(--accent);
  border-radius: var(--radius-sm); padding: 10px 14px;
  cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; justify-content: space-between;

<script>
// ===== DATA STORE =====
var DATA_URL = 'https://api.github.com/repos/Uoyiz223/hunaochufang/contents/data.json';
var DATA_RAW_URL = 'https://raw.githubusercontent.com/Uoyiz223/hunaochufang/main/data.json';
var GH_API = 'https://api.github.com/repos/Uoyiz223/hunaochufang/contents/data.json';
var _dataCache = null;
var _dataSha = null;
var _ghToken = _p1 + _p2; // assembled from split files

// Decode base64 + UTF-8 (atob only handles latin1, manual UTF-8 decode needed)
function b64ToUTF8(b64) {
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

// Load shared data from GitHub
function loadSharedData(callback) {
  // Use GitHub API (no CDN cache) to get fresh data
  fetch(GH_API + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d) {
      _dataSha = d.sha;
      // Decode base64 content with proper UTF-8 handling
      var decoded = JSON.parse(b64ToUTF8(d.content));
      _dataCache = decoded;
      callback(decoded);
    })
    .catch(function() {
      // Fallback to raw CDN with cache bust
      fetch(DATA_RAW_URL + '?t=' + Date.now(), { cache: 'reload' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          _dataCache = d;
          callback(d);
        })
        .catch(function() {
          // Keep existing cache if we have one, only use empty as last resort
          if (!_dataCache) { _dataCache = { recipes: [], dishes: [] }; }
          callback(_dataCache);
        });
    });
}

// Auto-sync to GitHub
function autoSyncToGitHub(data, retryCount) {
  _dataCache = data;
  retryCount = retryCount || 0;

  function doPut() {
    var body = JSON.stringify(data, null, 2);
    // Encode to UTF-8 bytes then base64 (matches b64ToUTF8 decoder)
    var utf8Bytes = new TextEncoder().encode(body);
    var binary = '';
    for (var i = 0; i < utf8Bytes.length; i++) { binary += String.fromCharCode(utf8Bytes[i]); }
    var encoded = btoa(binary);
    var payload = {
      message: 'Auto-sync: ' + new Date().toLocaleString('zh-CN'),
      content: encoded,
      sha: _dataSha,
      branch: 'main'
    };
    fetch(GH_API, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + _ghToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
      .then(function(r) { return r.json().then(function(j) { return {ok: r.ok, status: r.status, body: j}; }); })
      .then(function(res) {
        if (res.ok && res.body.content && res.body.content.sha) {
          _dataSha = res.body.content.sha;
          showToast('☁️ 已自动同步到云端！所有人刷新即可看到');
        } else if (res.status === 409 && retryCount < 2) {
          // SHA conflict - fetch fresh SHA and retry
          fetch(GH_API + '?t=' + Date.now(), {
            headers: { 'Authorization': 'token ' + _ghToken, 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          }).then(function(r) { return r.json(); }).then(function(d) {
            _dataSha = d.sha;
            autoSyncToGitHub(data, retryCount + 1);
          }).catch(function() { showToast('⚠️ 同步冲突，数据仅在本地'); });
        } else if (!_dataSha && retryCount < 1) {
          // No SHA yet - fetch it first
          fetch(GH_API + '?t=' + Date.now(), {
            headers: { 'Authorization': 'token ' + _ghToken, 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          }).then(function(r) { return r.json(); }).then(function(d) {
            _dataSha = d.sha;
            autoSyncToGitHub(data, retryCount + 1);
          }).catch(function() { showToast('⚠️ 同步失败，数据仅在本地'); });
        } else {
          showToast('⚠️ 同步失败，数据仅在本地。请告诉我');
        }
      })
      .catch(function() {
        showToast('⚠️ 网络问题，数据仅在本地保存');
      });
  }
  doPut();
}

// Compress image to max 200KB as JPEG for GitHub storage
function compressImage(dataUrl, maxKB, callback) {
  maxKB = maxKB || 200;
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var maxW = 800; var maxH = 800;
    var w = img.width; var h = img.height;
    if (w > maxW || h > maxH) {
      var ratio = Math.min(maxW / w, maxH / h);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
    }
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    // Try quality 0.7 first, reduce if too large
    var quality = 0.7;
    var result = canvas.toDataURL('image/jpeg', quality);
    // If still > maxKB, reduce quality further
    while (result.length > maxKB * 1024 * 1.37 && quality > 0.2) {
      quality -= 0.1;
      result = canvas.toDataURL('image/jpeg', quality);
    }
    callback(result);
  };
  img.onerror = function() { callback(dataUrl); };
  img.src = dataUrl;
}

function loadRecipes() {
  if (_dataCache && _dataCache.recipes) return _dataCache.recipes;

}

function saveRecipes(data) {
  var all = _dataCache || { recipes: [], dishes: [] };
  all.recipes = data;

// ===== UTILS =====
function escHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== PARSE STEPS =====
function parseSteps(text) {
  if (!text) return ['✨ 按个人口味自由发挥吧～'];
  var steps = [];
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  var stepPat = /^(\d+)[\.\)、.·\s]+(.+)/;
  var inSteps = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    var m = line.match(stepPat);
    if (m) { inSteps = true; steps.push(m[2].trim()); }
    else if (inSteps && line.length > 3) { steps.push(line); }
  }
  if (steps.length === 0) {
    if (text.length > 100) {
      var parts = text.split(/[。；;]/);
      steps = parts.filter(function(p) { return p.trim().length > 8; }).map(function(p) { return p.trim() + '。'; });
      if (steps.length < 2) steps = [text.substring(0, Math.min(500, text.length))];
    } else { steps = [text]; }
  }
  return steps;
}

function initCrop() {
  var img = document.getElementById('cropImg');
  var box = document.getElementById('cropBox');
  var wrapper = document.getElementById('cropWrapper');
  if (!img || !box) return;
  var maxDim = Math.max(img.naturalWidth, img.naturalHeight) || 400;
  var imgDisplayW = Math.min(wrapper.clientWidth, img.naturalWidth, 400);
  var ratio = imgDisplayW / (img.naturalWidth || 1);
  var imgDisplayH = (img.naturalHeight || 300) * ratio;
  var size = Math.min(imgDisplayW, imgDisplayH, 280);
  var left = (wrapper.clientWidth - size) / 2;
  var top = (imgDisplayH - size) / 2;
  box.style.width = size + 'px';
  box.style.height = size + 'px';
  box.style.left = left + 'px';
  box.style.top = top + 'px';
  var scale = 1;
  wrapper.onwheel = function(e) {
    e.preventDefault();
    scale = Math.max(0.5, Math.min(3, scale + (e.deltaY < 0 ? 0.1 : -0.1)));
    img.style.transform = 'scale(' + scale + ')';
    img.style.transformOrigin = '0 0';
  };
  var dragging = false, startX, startY, imgX = 0, imgY = 0;
  wrapper.onmousedown = function(e) { dragging = true; startX = e.clientX - imgX; startY = e.clientY - imgY; e.preventDefault(); };
  wrapper.onmousemove = function(e) { if (dragging) { imgX = e.clientX - startX; imgY = e.clientY - startY; img.style.marginLeft = imgX + 'px'; img.style.marginTop = imgY + 'px'; } };
  wrapper.onmouseup = function() { dragging = false; };
  wrapper.onmouseleave = function() { dragging = false; };
}

function applyCrop() {
  var img = document.getElementById('cropImg');
  var box = document.getElementById('cropBox');
  if (!img || !box) { closeCropModal(); return; }
  var canvas = document.createElement('canvas');
  var rect = img.getBoundingClientRect();
  var boxRect = box.getBoundingClientRect();
  var scaleX = img.naturalWidth / rect.width;
  var scaleY = img.naturalHeight / rect.height;
  var sx = (boxRect.left - rect.left) * scaleX;
  var sy = (boxRect.top - rect.top) * scaleY;
  var sw = boxRect.width * scaleX;
  var size = Math.min(sw, 400);
  canvas.width = size; canvas.height = size;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sw, 0, 0, size, size);
  recipeImageData = canvas.toDataURL('image/jpeg', 0.85);
  _cropTarget.imageData = recipeImageData;
  closeModal();
  // Re-show form with cropped image
  setTimeout(function() {
    var formData = {
      title: (document.getElementById('fTitle')||{}).value || '',
      authorName: (document.getElementById('fAuthor')||{}).value || '',
      ingredients: (document.getElementById('fIngredients')||{}).value || '',
      method: (document.getElementById('fMethod')||{}).value || '',
      image: recipeImageData,
      ingrImage: ingrImageData,
      methodImage: methodImageData
    };
    showRecipeForm(formData, -1);
  }, 100);
}

// ===== OCR EXTRACT using Tesseract.js (runs entirely in browser) =====
var _ocrWorker = null;
function ocrFromImage(type) {
  var imgData = type === 'ingr' ? ingrImageData : methodImageData;
  if (!imgData) { showToast('⚠️ 请先上传截图再提取文字'); return; }
  var targetId = type === 'ingr' ? 'fIngredients' : 'fMethod';
  var existing = document.getElementById(targetId);
  if (existing) { existing.value = '🔍 正在识别文字，请稍候...'; }
  showToast('🔍 正在识别文字...');

  // Load Tesseract if not loaded yet
  function doOCR() {
    if (typeof Tesseract === 'undefined') {
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      script.onload = function() { runTesseract(); };
      script.onerror = function() {
        showToast('⚠️ OCR 库加载失败，请检查网络或直接打字');
        if (existing) { existing.value = ''; }
      };
      document.head.appendChild(script);
    } else {
      runTesseract();
    }
  }

  function runTesseract() {
    Tesseract.recognize(imgData, 'chi_sim+eng', {
      logger: function(m) {
        if (m.status === 'recognizing text' && m.progress) {
          var pct = Math.round(m.progress * 100);
          if (existing && pct % 20 === 0) { existing.value = '🔍 识别中...' + pct + '%'; }
        }
      }
    }).then(function(result) {
      var text = result.data.text.trim();
      // Aggressively clean spaces from OCR output:
      // 1. Remove ALL spaces/newlines between CJK characters
      text = text.replace(/([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])\s+([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])/g, function(m, c1, c2) { return c1 + c2; });
      // 2. Remove any remaining space-like chars (full-width spaces, zero-width)
      text = text.replace(/[\u3000\u2000-\u200f\u2028-\u202f\u205f\u00a0]/g, '');
      // 3. Remove spaces at start of lines
      text = text.replace(/^[ ]+/gm, '');
      // 4. Collapse multiple spaces to one (for Latin/numbers)
      text = text.replace(/  +/g, ' ');
      // 5. Condense excessive newlines
      text = text.replace(/\n{3,}/g, '\n\n');
      if (!text) { showToast('⚠️ 未识别到文字，请手动输入'); if (existing) existing.value = ''; return; }
      if (existing) { existing.value = text; }
      showToast('✅ 识别完成！请检查并修改文字');
    }).catch(function(err) {
      showToast('⚠️ 识别失败，请直接打字');
      if (existing) { existing.value = '';
      console.error('OCR error:', err); }
    });
  }
  doOCR();
}

      html += '<div class="dish-footer"><button class="btn btn-ghost btn-sm btnEditDish" data-idx="' + i + '">✏️ 编辑</button><button class="btn btn-danger btn-sm btnDelDish" data-idx="' + i + '">🗑️</button></div>';
      html += '</div>';
      parts.push(html);
    }
    grid.innerHTML = parts.join('');
  }
  bindDishActions();
}

function bindDishActions() {
  document.querySelectorAll('.btnDelDish').forEach(function(b) { b.addEventListener('click', function() {
    var idx = parseInt(this.dataset.idx); var dishes = loadDishes();
    if (confirm('😢 确定要删除这条成品记录吗？')) { dishes.splice(idx, 1); saveDishes(dishes); renderDishes(); showToast('🗑️ 成品记录已删除'); }
  });});
  document.querySelectorAll('.btnEditDish').forEach(function(b) { b.addEventListener('click', function() { var idx = parseInt(this.dataset.idx); showDishForm(loadDishes()[idx], idx); });});
}

// ===== DISH FORM =====
var dishPhotoData = null;
function showDishForm(existing, editIdx) {
  var isEdit = typeof editIdx !== 'undefined';
  var title = isEdit ? existing.title : '';
  var authorName = isEdit ? (existing.authorName || '') : '';
  var desc = isEdit ? existing.desc : '';
  var rating = isEdit ? (existing.rating || 0) : 0;
  dishPhotoData = isEdit ? (existing.photo || null) : null;

  var authorOptions = USERS.map(function(u) { return '<option value="' + escAttr(u.name) + '"' + (authorName === u.name ? ' selected' : '') + '>' + escHtml(u.name) + '</option>'; }).join('');
  var recipes = loadRecipes();
  var recipeOptions = '<option value="">-- 🍲 从菜谱中选择 --</option>';
  for (var r = 0; r < recipes.length; r++) { var rp = recipes[r]; recipeOptions += '<option value="' + escAttr(rp.title) + '"' + (title === rp.title ? ' selected' : '') + '>' + escHtml(rp.title) + ' 👤' + escHtml(rp.authorName || '?') + '</option>'; }
  if (title && !recipes.some(function(rp) { return rp.title === title; })) { recipeOptions += '<option value="' + escAttr(title) + '" selected>' + escHtml(title) + ' (手动)</option>'; }

  var ratingLabels = ['💩 拉完了', '😐 NPC', '🙂 人上人', '😋 顶级', '🤯 夯爆了'];
  var ratingRadios = '';
  for (var s = 1; s <= 5; s++) {
    var checked = s === rating ? ' checked' : '';
    ratingRadios += '<label class="rating-radio-label' + (s === rating ? ' checked' : '') + '"><input type="radio" name="fRating" value="' + s + '"' + checked + ' onchange="onRatingChange(this)"><span>' + ratingLabels[s-1] + '</span></label>';
  }

  var preview = dishPhotoData ? '<img class="preview-img" src="' + dishPhotoData + '" alt="预览">' : '';
  var fileClass = dishPhotoData ? ' has-file' : '';

  var html = '<h3>' + (isEdit ? '✏️ 编辑成品' : '📸 上传成品') + '</h3>' +
    '<p class="form-hint">🎉 恭喜完成一道菜！记录下你的杰作吧～</p>' +
    '<div class="form-group"><label>🍲 菜名（从菜谱选择）</label><select id="fDishTitle">' + recipeOptions + '</select></div>' +
    '<div class="form-group"><label>👤 制作者</label><select id="fDishAuthor">' + authorOptions + '</select></div>' +
    '<div class="form-group"><label>📸 成品美照</label><div class="file-upload-area' + fileClass + '" id="fileArea" onclick="document.getElementById(\'fPhoto\').click()">' +
      preview + '<div id="fileHint" style="' + (dishPhotoData ? 'display:none' : '') + '">请上传你自己拍摄的成品照片哦</div>' +
      '<input type="file" id="fPhoto" accept="image/*" style="display:none" onchange="handlePhoto(this)"></div></div>' +
    '<div class="form-group"><label>💬 品尝描述</label><textarea id="fDishDesc" placeholder="口感如何？卖相怎么样？有什么想说的？" rows="3">' + escHtml(desc) + '</textarea></div>' +
    '<div class="form-group"><label>🏆 口味评价（单选）</label><div class="rating-radio-group" id="ratingGroup">' + ratingRadios + '</div><input type="hidden" id="fRatingVal" value="' + rating + '"></div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveDishForm(' + (isEdit ? editIdx : -1) + ')">💾 保存成品</button></div>';
  openModal(html, '600px');
}

function onRatingChange(el) {
  var val = parseInt(el.value);
  document.getElementById('fRatingVal').value = val;
  document.querySelectorAll('.rating-radio-label').forEach(function(lbl) { lbl.classList.remove('checked'); });
  el.parentElement.classList.add('checked');
}

function handlePhoto(input) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var rawData = e.target.result;
    // Compress before storing
    compressImage(rawData, 200, function(compressed) {
      dishPhotoData = compressed;
      var area = document.getElementById('fileArea');
      var existing = area.querySelector('.preview-img'); if (existing) existing.remove();
      var img = document.createElement('img'); img.className = 'preview-img'; img.src = dishPhotoData; img.alt = '预览';
      area.insertBefore(img, area.firstChild); area.classList.add('has-file');
      var hint = document.getElementById('fileHint'); if (hint) hint.style.display = 'none';
      showToast('📸 照片已压缩上传');
    });
  };
  reader.readAsDataURL(file);
}

function saveDishForm(editIdx) {
  var title = document.getElementById('fDishTitle').value;
  var authorName = document.getElementById('fDishAuthor').value;
  var desc = document.getElementById('fDishDesc').value.trim();
  var rating = parseInt(document.getElementById('fRatingVal').value) || 0;
  if (!title) { alert('🍲 请从菜谱中选择菜名哦～'); return; }
  var dishes = loadDishes();
  var entry = { title: title,
      authorName: authorName, desc: desc, rating: rating, photo: dishPhotoData || '', date: new Date().toISOString() };
  if (editIdx >= 0) { entry.date = dishes[editIdx].date; if (!dishPhotoData) entry.photo = dishes[editIdx].photo || ''; dishes[editIdx] = entry; }
  else { dishes.unshift(entry); }
  saveDishes(dishes); closeModal(); renderDishes();
  showToast('🎉 成品记录保存成功！');
}

// ===== INIT =====
document.getElementById('btnAddRecipe').addEventListener('click', function() { showRecipeForm(); });
document.getElementById('btnAddDish').addEventListener('click', function() { showDishForm(); });
renderUsers(); renderRecipes(); renderDishes();

</script>
</body>
</html>
